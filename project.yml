name: GitDuo

options:
  bundleIdPrefix: com.gitduo
  deploymentTarget:
    iOS: "27.0"          # 决策 #2「目标平台 iOS 27 · 纯 iPhone」—— 用户 2026-10-05 拍板（有 iOS 27 设备可实测）
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

packages:
  GitHubAPI:
    path: Packages/GitHubAPI
  GitDuoAuth:
    path: Packages/GitDuoAuth
  GitDuoCore:
    path: Packages/GitDuoCore
  GitDuoDesign:
    path: Packages/GitDuoDesign
  GitDuoKit:
    path: Packages/GitDuoKit

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"                     # 决策 #9：Swift 6 严格并发
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  GitDuo:
    type: application
    platform: iOS
    sources:
      - path: GitDuo
    dependencies:
      - package: GitHubAPI
        product: GitHubAPI
      - package: GitDuoAuth
        product: GitDuoAuth
      - package: GitDuoCore
        product: GitDuoCore
      - package: GitDuoDesign
        product: GitDuoDesign
      - package: GitDuoKit
        product: GitDuoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gitduo.app   # ⚠️ 占位（Bundle ID 属「发布准备」待补项）
        PRODUCT_NAME: GitDuo
        # 真机签名（本机配置，取自 Secrets.xcconfig，**不把 Team ID 写死进版本库**）。
        # 模拟器构建走 CODE_SIGNING_ALLOWED=NO，不读这两项 ⇒ 没有 Secrets.xcconfig 也能 make build。
        # 免费个人 Apple ID 可用：本 App 不需要任何特殊 entitlement（Keychain 走默认 access group）。
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(GITDUO_DEVELOPMENT_TEAM)
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "2.0"
        GENERATE_INFOPLIST_FILE: NO
        # Swift 6.2 起：App target 默认主 actor，并行显式 opt-in（TECH_SPEC §10.6 / §12.1）
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # Liquid Glass 是 iOS 27 的默认基线，非可选效果（决策 #3 / §10.1）
        TARGETED_DEVICE_FAMILY: "1"       # 纯 iPhone（决策 #2）
        # 【新口径 2026-10-11】App 图标已定稿并接入（此前"暂不补、显式置空"的口径作废）。
        # 定稿 = 黑底酸性绿霓虹一笔画，1024×1024 无 alpha，单尺寸 universal（iOS 单图标规范）。
        # 2026-10-17 起 appiconset 内这份是**唯一**一份（仓库根那份 1024 母版与生图素材已删）。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE: NO
    info:
      path: GitDuo/Resources/Info.plist
      properties:
        CFBundleDisplayName: GitDuo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # client_id / client_secret 由 Secrets.xcconfig（git-ignored）注入；读取点只有 AppConfig（§3.7）
        # ⚠️ secret 是平台强制的"软机密"（决策 #30）：挡随手薅、不挡反编译，只用于换令牌/刷新/撤销
        GitDuoClientID: $(GITDUO_CLIENT_ID)
        GitDuoClientSecret: $(GITDUO_CLIENT_SECRET)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 决策 #15 / §3.7：回调 URL scheme —— 注册后即对外契约，改动需回 GitHub 重配
        # ⚠️ 裸名 scheme 不符合 RFC 8252 §7.1（§3.9 / §16 未来工作）
        CFBundleURLTypes:
          - CFBundleURLName: com.gitduo.oauth
            CFBundleURLSchemes:
              - gitduo
        ITSAppUsesNonExemptEncryption: false

  # App 层单测（T1 —— 计划见 .opencode/T1-app-layer-test-target-plan.md）。
  #
  # ⚠️ 目录**必须在仓库根**：App target 的 sources 是 `path: GitDuo`，
  #    测试若放进 GitDuo/ 里会被**编进 App 本体**。
  # ⚠️ 它挂宿主 App（TEST_HOST）⇒ 每次跑测试都会在模拟器里**真的启动 GitDuo 本体**。
  GitDuoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GitDuoTests
    dependencies:
      - target: GitDuo        # xcodegen 据此自动设 TEST_HOST / BUNDLE_LOADER
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GitDuo:
    build:
      targets:
        GitDuo: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - GitDuoTests
